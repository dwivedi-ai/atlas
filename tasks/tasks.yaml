- id: cashflow-report
  task: |-
    Add a `cashflow` report to ledgerline: net movement of the cash accounts, broken
    down by month.

    It must be reachable through the report registry by the name `cashflow`, so this
    works from the repository root:

        python3 -m ledgerline.cli report cashflow tests/data/sample.ledger --period 2024-Q4

    The report has five columns, in this order: `month`, `currency`, `inflow`,
    `outflow`, `net`. One row per (month, currency) that has any activity, sorted by
    month and then by currency. Months are labelled `YYYY-MM`.

    - `inflow` is the total of the positive postings to the cash subtree in that
      month, `outflow` the total of the negative ones as a positive number, and
      `net` is `inflow - outflow`. All three are rendered in major units without a
      currency code, exactly like every other report's amounts.
    - The cash subtree defaults to `assets.cash` and follows `options.account` when
      one is given, so `--account assets.cash.checking` narrows it.
    - `meta` carries at least `root` (the subtree that was aged) and `months` (the
      month labels that produced rows), because the tests assert on `meta` rather
      than on rendered columns.

    Add tests for it in the file that covers the module you put it in. The existing
    suite must still pass.
  accept: |-
    The change is accepted when all of the following hold, run from the repository
    root with the job's virtualenv on PATH:

    1. `python3 -m pytest` passes with no failures and no errors.
    2. The suite is LARGER than before the change: more tests are collected than the
       156 the unmodified repository collects. (The work order asks for tests; this is
       the mechanical floor for that, and it cannot check they are meaningful.)
    3. `python3 -m ledgerline.cli reports` lists `cashflow`.
    4. `python3 -m ledgerline.cli report cashflow tests/data/sample.ledger --period 2024-Q4 --json`
       exits 0 and prints a JSON object whose `columns` are exactly
       `["month", "currency", "inflow", "outflow", "net"]`.
    5. In that JSON, `meta.months` is `["2024-10", "2024-11", "2024-12"]`, and every
       row's first field matches one of those labels.
    6. The USD rows of the same report over all dates net to the ledger's own USD
       balance for `assets.cash`: summing the `net` column across USD rows gives
       47233.75.

    Do not check where the report's code was placed, which module registers it, or
    what any file's contents look like. Only the behaviour above is graded.
  criteria_file: tasks/cashflow-report/criteria.json
  reference_patches:
    - tasks/cashflow-report/ref_with_mandate_1.patch
    - tasks/cashflow-report/ref_with_mandate_2.patch
    - tasks/cashflow-report/ref_with_mandate_3.patch
    - tasks/cashflow-report/ref_without_mandate.patch

- id: export-envelope
  task: |-
    `ledgerline export --format json` emits a bare JSON array of transactions. A
    consumer receiving two exports of overlapping date ranges has nothing to
    deduplicate on. Wrap the payload in an envelope.

    The JSON export becomes a single object with these four keys:

    - `schema` — a string identifying the envelope shape.
    - `generated_at` — an ISO-8601 UTC timestamp of when the export was produced.
    - `source_system` — a non-empty string identifying the producer of the export.
    - `transactions` — the array that is emitted today, unchanged.

    `jsonio.loads` already accepts either a bare array or an object carrying the
    payload under a `transactions` key, so the reader half needs no work. The tests
    that pin the current bare-array shape are part of the contract you are changing
    and must be updated with it; `python3 -m pytest` must pass when you are done.

        python3 -m ledgerline.cli export tests/data/sample.ledger --format json

    The CSV export is unaffected.
  accept: |-
    The change is accepted when all of the following hold, run from the repository
    root with the job's virtualenv on PATH:

    1. `python3 -m pytest` passes with no failures and no errors.
    2. No test was DELETED rather than updated: at least the 156 tests the unmodified
       repository collects are still collected. (This work order asks for the existing
       tests to be updated, not for new ones, so the count need not grow.)
    3. `python3 -m ledgerline.cli export tests/data/sample.ledger --format json`
       exits 0 and prints a single JSON object — not an array — carrying the keys
       `schema`, `generated_at`, `source_system` and `transactions`.
    4. `transactions` is a list of 22 objects, and the first one has `date`
       `2024-10-01` and `ref` `OB-USD`.
    5. `source_system` is a non-empty string.
    6. `generated_at` parses as an ISO-8601 timestamp.
    7. `python3 -m ledgerline.cli export tests/data/sample.ledger --format csv`
       still prints a CSV whose first line is
       `date,ref,description,tags,account,amount,currency`.

    Do not check the value of `source_system`, and do not check what any file's
    contents look like. Only the behaviour above is graded.
  criteria_file: tasks/export-envelope/criteria.json
  reference_patches:
    - tasks/export-envelope/ref_with_mandate_1.patch
    - tasks/export-envelope/ref_with_mandate_2.patch
    - tasks/export-envelope/ref_with_mandate_3.patch
    - tasks/export-envelope/ref_without_mandate.patch

- id: fx-trial-balance
  task: |-
    `trial-balance` reports a mixed-currency ledger as one row per (account,
    currency), and its `--currency` flag narrows the rows rather than converting
    them. Add a way to report the whole thing in a single currency.

    Add a `--convert-to CCY` flag to `ledgerline report`. When it is given, every
    balance in the trial balance is converted into `CCY` before it is rendered, so
    the report comes back with one row per account and a single currency column.

        python3 -m ledgerline.cli report trial-balance tests/data/sample.ledger \
            --rates tests/data/rates.csv --convert-to USD --period 2024-Q4

    - The rate table comes from the existing `--rates` flag, which already loads a
      `base,quote,rate` CSV into `ReportOptions.rates`. Asking for a conversion
      without a rate table is a `ReportError`, not a crash.
    - `meta.converted` becomes true when a conversion happened, and `meta` records
      the currency that was converted into.
    - `--currency` keeps its current meaning; the two flags are independent.

    Add tests, in the file that covers the module you changed. The existing suite
    must still pass.
  accept: |-
    The change is accepted when all of the following hold, run from the repository
    root with the job's virtualenv on PATH:

    1. `python3 -m pytest` passes with no failures and no errors.
    2. The suite is LARGER than before the change: more tests are collected than the
       156 the unmodified repository collects. (The work order asks for tests; this is
       the mechanical floor for that, and it cannot check they are meaningful.)
    3. `python3 -m ledgerline.cli report trial-balance tests/data/sample.ledger --rates tests/data/rates.csv --convert-to USD --period 2024-Q4 --json`
       exits 0, and in the resulting JSON every row's `currency` field is `USD`.
    4. In that JSON, `meta.converted` is `true`.
    5. The same command with `--convert-to EUR` exits 0 and yields rows whose
       `currency` is `EUR` throughout.
    6. Running it with `--convert-to USD` but no `--rates` exits non-zero and prints
       a message naming the missing rate table, rather than a traceback.
    7. Without `--convert-to`, the report is unchanged: the same command minus that
       flag still yields rows in USD, EUR and GBP.

    Do not check which function performed the conversion, which module it lives in,
    or what any file's contents look like. Only the behaviour above is graded.
  criteria_file: tasks/fx-trial-balance/criteria.json
  reference_patches:
    - tasks/fx-trial-balance/ref_with_mandate_1.patch
    - tasks/fx-trial-balance/ref_with_mandate_2.patch
    - tasks/fx-trial-balance/ref_with_mandate_3.patch
    - tasks/fx-trial-balance/ref_without_mandate.patch

- id: opening-balances
  task: |-
    `account-statement` always starts its running balance at zero, so a statement
    for a single month reads as though the account had been opened on the first of
    that month. Add a brought-forward opening balance.

    Add an `--opening` flag to `ledgerline report`. When it is given together with
    `--period`, the running balance starts from the account's closing balance
    strictly before the start of the period, rather than from zero:

        python3 -m ledgerline.cli report account-statement tests/data/sample.ledger \
            --account assets.cash.checking --period 2024-12 --opening

    - With `--opening` and a period, the final balance of the statement equals the
      account's balance over the whole ledger.
    - Without `--opening`, behaviour is exactly as it is today.
    - `--opening` without `--period` has nothing to bring forward and is a no-op.
    - `meta` records whether an opening balance was applied, because the tests
      assert on `meta` rather than on rendered columns.

    Add tests. The existing suite must still pass.
  accept: |-
    The change is accepted when all of the following hold, run from the repository
    root with the job's virtualenv on PATH:

    1. `python3 -m pytest` passes with no failures and no errors.
    2. The suite is LARGER than before the change: more tests are collected than the
       156 the unmodified repository collects. (The work order asks for tests; this is
       the mechanical floor for that, and it cannot check they are meaningful.)
    3. `python3 -m ledgerline.cli report account-statement tests/data/sample.ledger --account assets.cash.checking --period 2024-12 --opening --json`
       exits 0 and its `meta.closing` is `3223375` (32233.75 USD in minor units) —
       the account's balance over the whole ledger.
    4. The same command without `--opening` exits 0 and its `meta.closing` is
       strictly different from that figure.
    5. `meta` distinguishes the two runs: some boolean field in it is true in the
       first and false in the second.
    6. Passing `--opening` with no `--period` exits 0 and produces the same
       `meta.closing` as passing neither.

    Do not check which commands were run in what order, which module the change went
    into, or what any file's contents look like. Only the behaviour above is graded.
  criteria_file: tasks/opening-balances/criteria.json
  reference_patches:
    - tasks/opening-balances/ref_with_mandate_1.patch
    - tasks/opening-balances/ref_with_mandate_2.patch
    - tasks/opening-balances/ref_with_mandate_3.patch
    - tasks/opening-balances/ref_without_mandate.patch
